[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chengyulang"
version = "0.1.0"
description = "A playful Python-backed DSL where Chinese idiom spacing changes semantics."
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["dsl", "python", "chinese", "idiom", "esolang"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Compilers"
]
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.2", "ruff>=0.6"]

[project.scripts]
chengyulang = "chengyulang.cli:main"

[tool.setuptools.packages.find]
include = ["chengyulang*"]

[tool.setuptools.package-data]
"chengyulang.data" = ["*.json"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

